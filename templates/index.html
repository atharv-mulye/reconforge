<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Authorized web application security assessment platform.">
    <title>Automated Web Application VAPT Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">
        <section class="scanner-card" aria-labelledby="page-title">
            <p class="eyebrow">Security Assessment Platform</p>
            <h1 id="page-title">Automated Web Application VAPT Scanner</h1>
            <p class="description">
                A foundation for authorized web application security assessment. Only scan systems you own or have explicit permission to test.
            </p>

            <form id="scan-form" action="{{ url_for('scan') }}" method="post">
                <label for="target-url">Target URL</label>
                <input id="target-url" name="target_url" type="url" placeholder="http://localhost:3000" value="{{ target_url | default('') }}" required>

                <label for="target-type">Target Type</label>
                <select id="target-type" name="target_type">
                    <option value="web_application" selected>Web Application</option>
                </select>

                <button type="submit">Start Scan</button>
                {% if error %}
                    <p class="form-message error" role="alert">{{ error }}</p>
                {% endif %}
                {% if success %}
                    <p class="form-message success" role="status">{{ success }}</p>
                {% endif %}
            </form>
        </section>
    </main>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
